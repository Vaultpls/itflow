user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 512M;
    server_tokens off;

    # The host nginx terminates TLS and sets X-Forwarded-Proto
    map $http_x_forwarded_proto $itflow_https {
        default off;
        https   on;
    }

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;
        root /var/www/localhost/htdocs;
        index index.php index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        # Replaces the root .htaccess RedirectMatch
        location ~ /\.(git|github|gitignore|gitattributes) {
            deny all;
        }
        location = /config.php {
            deny all;
        }
        location = /db.sql {
            deny all;
        }
        location ~ /\.ht {
            deny all;
        }

        # Replaces scripts/.htaccess and cron/.htaccess
        location ^~ /scripts/ {
            deny all;
        }
        location ^~ /cron/ {
            deny all;
        }

        # Deployment assets are repo content, not web content
        location ^~ /deploy/ {
            deny all;
        }

        # Replaces uploads/tmp/.htaccess and uploads/backups/.htaccess
        location ^~ /uploads/tmp/ {
            deny all;
        }
        location ^~ /uploads/backups/ {
            deny all;
        }

        # No PHP execution anywhere under uploads/
        location ~* ^/uploads/.*\.(php|phtml|phar|phps|cgi|pl|sh)$ {
            deny all;
        }

        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param SERVER_NAME $host;
            fastcgi_param HTTPS $itflow_https;
            fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
            fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
            fastcgi_param HTTP_X_REAL_IP $http_x_real_ip;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_read_timeout 300;
        }
    }
}
